     ② 弹药耗尽，或有敌人贴身（被贴住），或已经移动过 → 只能近战（melee）
     弹药耗尽时它就是一个普通近战兵，可以"走过去再打"。 */
  function inMelee(u) {
    return alive(u.side === "us" ? "them" : "us").some(function(e){
      return unitDist(u, e) === 1;
    });
  }

  function canShootNow(u) {
    return !!u.ranged && (u.shots || 0) > 0 && !hasMoved && !inMelee(u);
  }

  // 能站着开打的格子：默认只有贴身邻格；带 reach 的单位允许站到 2 格外
  // 双格目标的外圈 = 两格各自邻居的并集（去掉目标自己占的两格）
  // 注意"头格"才是站位：双格单位必须先扭头，让靠目标的那一端当头部。
  function approachOptions(act, target) {
    if (canShootNow(act)) return [{ x: act.x, y: act.y, cost: 0, ranged: true, dir: dirOf(act) }];
    var R = attackReach(act);
    var out = [], tcells = cellsOf(target);

    // 原地打：头已经贴身；双格单位还允许"原地扭头"（占位不变，尾巴换边）
    var self = selfSpot(act, target, R);
    if (self) out.push(self);

    for (var yy = 0; yy < H; yy++) {
      for (var xx = 0; xx < W; xx++) {
        if (xx === act.x && yy === act.y) continue;
        var c = pathCostTo(xx, yy);
        if (c === null || c <= 0) continue;          // 不在本回合可达范围（已含双格站位校验）
        var dmin = 99;
        for (var i = 0; i < tcells.length; i++) {
          var d = dist(xx, yy, tcells[i][0], tcells[i][1]);
          if (d < dmin) dmin = d;
        }
        if (dmin < 1 || dmin > R) continue;          // 头必须真的贴到目标（R 默认 1）
        var fd = fitDir(act, xx, yy, act, awayDir(act, xx, yy, target));
        if (!fd) continue;
        out.push({ x: xx, y: yy, cost: c, dir: fd });
      }
    }
    out.sort(function(a, b){ return a.cost - b.cost; });
    return out;
  }

  // 原地能不能打：头贴身直接用；双格再试"把头扭到另一端"
  function selfSpot(act, target, R) {
    var near = nearestCell({ x: act.x, y: act.y }, target);
    if (near && dist(act.x, act.y, near[0], near[1]) <= R)
      return { x: act.x, y: act.y, cost: 0, dir: dirOf(act) };
    if (!isWide(act)) return null;
    var d = dirOf(act), ox = act.x + d;
    if (ox < 0 || ox >= W || !near) return null;
    if (dist(ox, act.y, near[0], near[1]) > R) return null;
    // 尾巴那端更近 → 扭头，顺便把"站位"记到那一格上（占的两格没变）
    return { x: ox, y: act.y, cost: 0, dir: -d, turn: true };
  }

  // 在候选里挑出当前选中的那个；没选过就用最省的
  function pickSpot(opts) {
    if (!opts || !opts.length) return null;
    if (chosenApproach) {
      for (var i = 0; i < opts.length; i++) {
        if (key(opts[i].x, opts[i].y) === chosenApproach) return opts[i];
      }
    }
    return opts[0];
  }

  function canStrikeNow(act, target) {
    if (canShootNow(act)) return true;
    return unitDist(act, target) <= attackReach(act);
  }

  // 龙息：站在 from 打 t 时，身后那一格以及里面的单位
  // 方向必须取「起点 → 目标近端格」这条直线，斜着打才穿得对。
  // （以前用 near→far 当方向，那是目标自己的身子朝向；斜着打双格单位会算成横着穿）
  // 双格目标若整个身子正好压在这条直线上，就一格一格往前穿，直到离开身子。
  function breathInfo(act, from, t, steps) {
    if (!act.breath || act.ranged || !from) return null;
    // from 是出手时的头格。双格单位若传进来的方向不同（预览另一个落脚格），
    // 就按那个朝向重新取身体两格，再从里面挑离目标最近的一端当起点。
    var fromCell = { x: from.x, y: from.y };
    if (isWide(act)) {
      var fd = (from.dir === 1 || from.dir === -1) ? from.dir : dirOf(act);
      var bc = null, bd = 99;
      cellsAt(act, from.x, from.y, fd).forEach(function(c){
        var d = unitDist({ x: c[0], y: c[1], side: act.side, size: 1 }, t);
        if (d < bd) { bd = d; bc = c; }
      });
      if (bc) fromCell = { x: bc[0], y: bc[1] };
    }
    var near = nearestCell(fromCell, t);
    if (!near || dist(fromCell.x, fromCell.y, near[0], near[1]) !== 1) return null;
    var a = toCube(fromCell.x, fromCell.y), b = toCube(near[0], near[1]);
    var dv = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
    var cur = [b[0] + dv[0], b[1] + dv[1], b[2] + dv[2]];
    var h = fromCube(cur);
    var guard = 0;
    while (h && coversHex(t, h[0], h[1]) && guard++ < 4) {
      cur = [cur[0] + dv[0], cur[1] + dv[1], cur[2] + dv[2]];
      h = fromCube(cur);
    }
    if (!h) return null;
    var u = unitAt(h[0], h[1]);
    if (!u || u.dead || u === act || coversHex(t, h[0], h[1])) u = null;
    return { hex: h, unit: u, r: u ? calcDamage(act, u, steps, false) : null };
  }

  // 提示条用的一句话龙息说明
  function breathText(pv, act) {
    var bi = pv.breath;
    if (!bi || !bi.unit) return "";
    return " · 龙息→" + bi.unit.name + " " + bi.r.min + "–" + bi.r.max +
      (bi.unit.side === act.side ? "(友军)" : "");
  }

  function damagePreview(act, t, spot) {    var opts = approachOptions(act, t);
    var ap = spot || pickSpot(opts);
    // 站位是 ap 这一格（双格单位的头格）；若它本来就是自己的另一格，那就是"原地扭头"
    var onSelf = !!ap && coversHex(act, ap.x, ap.y);
    var shooting = canShootNow(act);
    var steps = (!shooting && ap && !onSelf) ? ap.cost : 0;
    var r = calcDamage(act, t, steps, shooting);
    var meets = !!ap && (function(){
      var cs = cellsOf(t), m = 99;
      for (var i = 0; i < cs.length; i++) m = Math.min(m, dist(ap.x, ap.y, cs[i][0], cs[i][1]));
      return m === 1;
    })();
    var back = (!shooting && act.enemyRetaliating !== false && (t.retaliationsLeft || 0) > 0 && meets)
      ? calcDamage(t, act, 0, false) : null;
    return {
      opts: opts, ap: ap, steps: steps, r: r, back: back, shooting: shooting,
      around: aroundTargets(act, t),                                  // 环攻/宽攻的额外目标
      splash: (shooting && act.shootingCloud) ? cloudTargets(act, t) : [],   // 弹射弹溅射范围
      breath: breathInfo(act, { x: ap ? ap.x : act.x, y: ap ? ap.y : act.y,
                                dir: ap && ap.dir ? ap.dir : dirOf(act) }, t, steps),
      kills: Math.min(t.count, Math.floor(r.avg / t.perHp))
    };
  }

  // 多目标特性的提示后缀（没有就是空串，别让提示条变长）
  function extraText(pv) {
    var out = "";
    if (pv.around && pv.around.length) out += " · 环攻/宽攻波及 " + pv.around.length + " 只";
    if (pv.splash && pv.splash.length) {
      var edible = pv.splash.filter(function(u){ return !u.splashImmune; }).length;
      out += " · 弹射 " + edible + " 只" + (edible < pv.splash.length ? "（" + (pv.splash.length - edible) + " 只免疫）" : "");
    }
    return out;
  }

  function markHex(x, y, cls) {
    var src = hexEls[key(x, y)];
    if (!src) return;
    var p = document.createElementNS(SVGNS, "polygon");
    p.setAttribute("points", src.getAttribute("points"));
    p.setAttribute("class", "hex " + cls);
    gPrev.appendChild(p);
  }

  // 选位模式：全场压暗，只留候选格亮着。
  // 不压暗的话，"在挑站位"和"只是看看伤害"看起来一模一样。
  function fieldShield() {
    var r = document.createElementNS(SVGNS, "rect");
    r.setAttribute("x", "0"); r.setAttribute("y", "0");
    r.setAttribute("width", VW); r.setAttribute("height", VH);
    r.setAttribute("fill", "#141a12");
    r.setAttribute("opacity", ".18");
    r.setAttribute("pointer-events", "none");
    return r;
  }

  // 候选格 → 目标的一道细箭头：站这一格打，方向就是它。
  // 六个候选格各画一条，落在目标处汇聚，方向差别一眼可比。
  function dirTick(x, y, tx, ty, strong) {
    var p0 = center(x, y), p1 = center(tx, ty);
    var dx = p1.cx - p0.cx, dy = p1.cy - p0.cy;
    var L = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / L, uy = dy / L;
    // 六边形是紧挨着的，两格之间几乎没有空隙——短线会被挤成看不见的 14px。
    // 所以从格心直接指到目标中心，画成一条完整指向线；格内文字靠白描边浮在线上。
    var a = 2, b = L - 5;
    var ax = p0.cx + ux * a, ay = p0.cy + uy * a;
    var bx = p0.cx + ux * b, by = p0.cy + uy * b;
    // 白色衬底：箭头压在浅橙候选格上，纯橙会糊成一片
    var bg = document.createElementNS(SVGNS, "line");
    bg.setAttribute("x1", ax); bg.setAttribute("y1", ay);
    bg.setAttribute("x2", bx); bg.setAttribute("y2", by);
    bg.setAttribute("stroke", "#fffdf6");
    bg.setAttribute("stroke-width", strong ? "6" : "5.4");
    bg.setAttribute("stroke-linecap", "round");
    bg.setAttribute("opacity", strong ? ".95" : ".8");
    bg.setAttribute("pointer-events", "none");
    gPrev.appendChild(bg);

    var ln = document.createElementNS(SVGNS, "line");
    ln.setAttribute("x1", ax); ln.setAttribute("y1", ay);
    ln.setAttribute("x2", bx); ln.setAttribute("y2", by);
    ln.setAttribute("stroke", "#8f3f06");
    ln.setAttribute("stroke-width", strong ? "3" : "2.6");
    ln.setAttribute("stroke-linecap", "round");
    ln.setAttribute("opacity", strong ? "1" : ".92");
    ln.setAttribute("marker-end", "url(#dirArrow)");
    ln.setAttribute("pointer-events", "none");
    gPrev.appendChild(ln);
  }

  // 能烧到第二个单位的候选格，右上角盖一枚紫标「2」
  function twoTag(x, y) {
    var c = center(x, y);
    var g = document.createElementNS(SVGNS, "g");
    g.setAttribute("pointer-events", "none");
    var bg = document.createElementNS(SVGNS, "circle");
    bg.setAttribute("cx", c.cx + 14); bg.setAttribute("cy", c.cy - 13);
    bg.setAttribute("r", "7.5");
    bg.setAttribute("fill", "#7d2b8c");
    g.appendChild(bg);
    var tx = document.createElementNS(SVGNS, "text");
    tx.setAttribute("x", c.cx + 14); tx.setAttribute("y", c.cy - 9.5);
    tx.setAttribute("text-anchor", "middle");
    tx.setAttribute("font-size", "9.5");
    tx.setAttribute("font-weight", "700");
    tx.setAttribute("fill", "#fff");
    tx.setAttribute("font-family", "system-ui,sans-serif");
    tx.textContent = "2";
    g.appendChild(tx);
    gPrev.appendChild(g);
  }

  // 在候选格上标步数与伤害，让"站哪打、打多少"一眼可比
  function labelHex(x, y, dmg, steps) {
    var c = center(x, y);
    if (steps > 0) {
      var a = document.createElementNS(SVGNS, "text");
      a.setAttribute("x", c.cx);
      a.setAttribute("y", c.cy + (dmg === null ? 4 : -5));
      a.setAttribute("text-anchor", "middle");
      a.setAttribute("font-size", "8.5");
      a.setAttribute("fill", "#b8621f");
      a.setAttribute("font-family", "system-ui,sans-serif");
      a.setAttribute("pointer-events", "none");
      // 选位时全场压暗、上面还会过一道方向箭头，文字得自带白边才浮得起来
      a.setAttribute("stroke", "#fff8ee");
      a.setAttribute("stroke-width", "2.2");
      a.setAttribute("paint-order", "stroke");
      a.textContent = steps + "步";
      gPrev.appendChild(a);
    }
    if (dmg === null) return;
    var b = document.createElementNS(SVGNS, "text");
    b.setAttribute("x", c.cx);
    b.setAttribute("y", c.cy + (steps > 0 ? 8 : 4));
    b.setAttribute("text-anchor", "middle");
    b.setAttribute("font-size", "11");
    b.setAttribute("font-weight", "600");
    b.setAttribute("fill", "#8d4413");
    b.setAttribute("font-family", "system-ui,sans-serif");
    b.setAttribute("pointer-events", "none");
    b.setAttribute("stroke", "#fff8ee");
    b.setAttribute("stroke-width", "2.4");
    b.setAttribute("paint-order", "stroke");
    b.textContent = dmg;
    gPrev.appendChild(b);
  }

  function renderPreview() {
    gPrev.innerHTML = "";
    var act = current();
    if (!act || over) return;
    var t = (approachMode && approachMode.target) ? approachMode.target : hoverUnit;
    if (!t || t.dead || t.side === act.side) return;
    if (!atkSet.has(key(t.x, t.y))) return;

    var pv = damagePreview(act, t);
    if (!pv.ap) return;

    var onSelf = (pv.ap.x === act.x && pv.ap.y === act.y);
    // 选位模式（点了敌人、正在挑落脚格）：全场压暗，只亮候选格。
    // 贴身时"原地"也是候选之一，同样压暗——不然看不出换个方向站会烧到谁。
    var picking = !!approachMode;
    if (picking) gPrev.appendChild(fieldShield());

    // 每个候选格各算一遍：站这儿打，龙息会穿到哪一格。
    // 以前只算选中格，玩家看不出"换一侧站会不会多烧一个"。
    var multi = pv.opts.length > 1;
    var rows = pv.opts.map(function(o){
      var onIt = (o.x === pv.ap.x && o.y === pv.ap.y);
      return {
        o: o,
        bi: onIt ? pv.breath : breathInfo(act, o, t, o.cost),
        dmg: Math.round(calcDamage(act, t, o.cost, !!o.ranged).avg)
      };
    });
    var dmgs = rows.map(function(r){ return r.dmg; });
    var varied = dmgs.some(function(d){ return d !== dmgs[0]; });   // 冲锋等单位才有差异

    // 会被龙息波到的格子先铺底（多个候选格烧同一格时只铺一次）
    if (picking) {
      var seenBreath = {};
      rows.forEach(function(r){
        if (!r.bi) return;
        var k = key(r.bi.hex[0], r.bi.hex[1]);
        if (seenBreath[k]) return;
        seenBreath[k] = 1;
        markHex(r.bi.hex[0], r.bi.hex[1], "breath-ghost");
      });
    }

    for (var i = 0; i < rows.length; i++) {
      var o = rows[i].o;
      if (o.x === pv.ap.x && o.y === pv.ap.y) continue;
      markHex(o.x, o.y, "approach-opt");
      if (picking) dirTick(o.x, o.y, t.x, t.y, false);
      if (multi) labelHex(o.x, o.y, varied ? dmgs[i] : null, o.cost);
      if (rows[i].bi && rows[i].bi.unit) twoTag(o.x, o.y);
    }
    if (!onSelf) markHex(pv.ap.x, pv.ap.y, "approach");
    if (multi) labelHex(pv.ap.x, pv.ap.y, varied ? Math.round(pv.r.avg) : null, pv.steps);
    if (picking) dirTick(pv.ap.x, pv.ap.y, t.x, t.y, true);
    // 贴身原地打时没有候选格，角标画在龙自己身上反而像误标——那种情况气泡里已经写了"龙息→谁"
    if (pv.breath && pv.breath.unit) twoTag(pv.ap.x, pv.ap.y);

    var from = center(pv.ap.x, pv.ap.y), to = center(t.x, t.y);
    var dx = to.cx - from.cx, dy = to.cy - from.cy;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var moving = !(pv.ap.x === act.x && pv.ap.y === act.y);

    if (moving && !multi) {
      var lab = document.createElementNS(SVGNS, "text");
      lab.setAttribute("x", from.cx);
      lab.setAttribute("y", from.cy + 6);
      lab.setAttribute("text-anchor", "middle");
      lab.setAttribute("font-size", "10");
      lab.setAttribute("fill", "#b8621f");
      lab.setAttribute("font-family", "system-ui,sans-serif");
      lab.setAttribute("pointer-events", "none");
      lab.textContent = "落脚 " + pv.steps + " 步";
      gPrev.appendChild(lab);
    }

    var ring = document.createElementNS(SVGNS, "circle");
    ring.setAttribute("cx", to.cx); ring.setAttribute("cy", to.cy);
    ring.setAttribute("r", "19");
    ring.setAttribute("fill", "none");
    ring.setAttribute("stroke", "#d3762a");
    ring.setAttribute("stroke-width", "1.5");
    ring.setAttribute("stroke-dasharray", "4 3");
    gPrev.appendChild(ring);

    if (pv.shooting || len > 32) {
      var line = document.createElementNS(SVGNS, "line");
      line.setAttribute("x1", from.cx + dx / len * 17);
      line.setAttribute("y1", from.cy + dy / len * 17);
      line.setAttribute("x2", to.cx - dx / len * 22);
      line.setAttribute("y2", to.cy - dy / len * 22);
      line.setAttribute("stroke", "#d3762a");
      line.setAttribute("stroke-width", "2.2");
      line.setAttribute("stroke-linecap", "round");
      line.setAttribute("marker-end", "url(#atkArrow)");
      gPrev.appendChild(line);
    }

    // 龙息：把"目标身后那格"标出来，站哪一侧的差别就看得见了
    var bi = pv.breath;
    if (bi) {
      var bc = center(bi.hex[0], bi.hex[1]);
      markHex(bi.hex[0], bi.hex[1], "breath");
      var l2 = document.createElementNS(SVGNS, "line");
      l2.setAttribute("x1", to.cx); l2.setAttribute("y1", to.cy);
      l2.setAttribute("x2", bc.cx); l2.setAttribute("y2", bc.cy);
      l2.setAttribute("stroke", "#a254b0");
      l2.setAttribute("stroke-width", "2");
      l2.setAttribute("stroke-dasharray", "5 3");
      l2.setAttribute("marker-end", "url(#breathArrow)");
      gPrev.appendChild(l2);
      if (bi.unit) {
        var bl = document.createElementNS(SVGNS, "text");
        bl.setAttribute("x", bc.cx);
        bl.setAttribute("y", bc.cy + 4);
        bl.setAttribute("text-anchor", "middle");
        bl.setAttribute("font-size", "11");
        bl.setAttribute("font-weight", "600");
        bl.setAttribute("fill", "#7d2b8c");
        bl.setAttribute("font-family", "system-ui,sans-serif");
        bl.setAttribute("pointer-events", "none");
        bl.textContent = Math.round(bi.r.avg);
        gPrev.appendChild(bl);
      }
    }

    // 伤害气泡已撤：数值统一由底部状态栏/战斗日志说（画面上只留站位与龙息方向）
  }

  function updateConfirmBar() {
    var bar = document.getElementById("confirmBar");
    var txt = document.getElementById("confirmText");
    if (!pendingAttack) { bar.classList.remove("show"); return; }
    var act = current(), t = pendingAttack.target;
    if (!act || !t || t.dead || pendingAttack.actId !== act.id) {
      pendingAttack = null;
      bar.classList.remove("show");
      return;
    }
    var pv = damagePreview(act, t, pendingAttack.spot || null);
    txt.innerHTML = "攻击 <b>" + t.name + " × " + t.count + "</b> · 预计 " +
      pv.r.min + "–" + pv.r.max +
      (pv.back ? " · 反击 " + pv.back.min + "–" + pv.back.max : " · 无反击") +
      breathText(pv, act) +
      (pv.shooting ? " · 射击" : " · 近战" + penaltyNote(act)) +
      (pv.ap && !pv.shooting ? " · 从 (" + pv.ap.x + "," + pv.ap.y + ") " + pv.steps + " 步" : "");
    bar.classList.add("show");
  }

  function performAttack(act, target, spot) {
    if (!act || !target || target.dead || busy) return;
    var pv = damagePreview(act, target, spot || null);
    if (!pv.ap) return;
    // 落脚格可能就是自己的另一半身子（原地扭头），那不算"走过去"
    var onSelf = coversHex(act, pv.ap.x, pv.ap.y);
    var dest = onSelf ? null : { x: pv.ap.x, y: pv.ap.y };
    var steps = dest ? pv.steps : 0;
    var shooting = !!pv.shooting;      // 必须在 hasMoved 置位之前定下来
    var face = (isWide(act) && (pv.ap.dir === 1 || pv.ap.dir === -1)) ? pv.ap.dir : dirOf(act);

    pendingAttack = null;
    hoverUnit = null;
    approachMode = null;
    chosenApproach = null;
    render();
    updateConfirmBar();

    // 出发格（打完就回要退这里）：必须在 walkTo 之前记下来
    var origin = { x: act.x, y: act.y, dir: dirOf(act) };
    var strike = function(){
      hasMoved = true;
      // 到位后按选定的朝向站好（尾巴甩在远离目标的一侧），再出手
      if (onSelf) { act.x = pv.ap.x; act.y = pv.ap.y; }
      if (isWide(act) && !shooting) act.dir = face;
      doAttack(act, target, steps, shooting, origin);
      render();
      if (!over) endActorSoon(620);
    };

    if (dest) {
      // 先走过去，再出手 —— 不是瞬移，路径上的格子逐个经过
      setHint(act.name + " 走向 (" + dest.x + "," + dest.y + ")，到位后攻击 " + target.name + "…");
      walkTo(act, dest, strike);
    } else {
      strike();
    }
  }

  function hoverPreview(u) {
    hoverUnit = u;
    var act = current();
    if (!u || !act || u.dead || u.side === act.side) { renderPreview(); return; }
    if (approachMode && approachMode.target && approachMode.target !== u) { renderPreview(); return; }
    if (!approachMode && lastHoverId !== u.id) {
      lastHoverId = u.id;
      chosenApproach = null;
    }
    if (!atkSet.has(key(u.x, u.y))) {
      setHint(u.name + " × " + u.count + " · 距离 " + unitDist(act, u) +
        " 格 · 可移动 " + act.speed + " 格" + (hasMoved ? "（本回合已移动）" : "") + " —— 打不到");
      renderPreview();
      return;
    }
    var opts = approachOptions(act, u);
    if (approachMode) {
      setHint(approachHint(act, u));
    } else if (opts.length > 1) {
      // 站位是关键：有得选就先说"有几个站位"，具体方向点了再展开
      var pv = damagePreview(act, u);
      setHint(u.name + " × " + u.count + " · " + opts.length + " 个站位可选 · 点它展开" +
        (pv.shooting ? "（射击）" : "（原地近战 " + pv.r.min + "–" + pv.r.max + penaltyNote(act) + breathText(pv, act) + "）"));
    } else if (canStrikeNow(act, u)) {
      var pv2 = damagePreview(act, u);
      setHint("对 " + u.name + " × " + u.count + "：预计 " + pv2.r.min + "–" + pv2.r.max +
        " · 击杀 " + pv2.kills +
        (pv2.back ? " · 反击 " + pv2.back.min + "–" + pv2.back.max : " · 无反击") +
        breathText(pv2, act) + extraText(pv2) +
        (pv2.shooting ? " · 射击" : " · 近战" + penaltyNote(act)));
    } else {
      setHint(u.name + " × " + u.count + " · " + opts.length +
        " 个落脚格可达 · 点它选择从哪一侧进攻");
    }
    renderPreview();
  }

  function render() {
    var act = current();

    for (var y = 0; y < H; y++) {
      for (var x2 = 0; x2 < W; x2++) {
        var e = hexEls[key(x2, y)];
        e.classList.remove("in-range", "atk", "sel", "can-move", "can-attack");
        if (selected && selected === act) {
          if (moveMap.has(key(x2, y)) && moveMap.get(key(x2, y)) > 0 && !unitAt(x2, y)) {
            e.classList.add("in-range", "can-move");
          }
          if (atkSet.has(key(x2, y))) {
            e.classList.add("atk", "can-attack");
          }
        }
      }
    }
    if (selected) {
      cellsOf(selected).forEach(function(c){
        var se = hexEls[key(c[0], c[1])];
        if (se) se.classList.add("sel");
      });
    }

    units.forEach(function(u){
      if (u.dead) return;
      ensureUnitEl(u);
      layoutUnit(u);
      var c = center(u.x, u.y);
      u.el.style.transform = "translate(" + c.cx + "px," + c.cy + "px)";
      u.el.classList.toggle("active", act === u);
      u.el.classList.toggle("defending", !!u.defending);
      u.el.classList.toggle("foe", !!(act && u.side !== act.side && atkSet.has(key(u.x, u.y))));
      u.cntEl.textContent = u.count;
      if (u.count >= 100) {
        u.cntEl.textContent = "99+";
      }
      var pct = Math.max(0, u.hp / u.maxHp);
      u.hpEl.setAttribute("width", (30 * pct).toFixed(2));
    });

    var card = document.getElementById("curCard");
    if (act && act.side === "us") {
      card.style.display = "";
      card.innerHTML =
        '<h3>当前行动</h3>' +
        '<div class="who"><div class="dot us">' + act.glyph + '</div>' +
        '<div><div class="n">' + act.name + (act.breath ? " · 龙息" : "") + (act.defending ? " · 防御中" : "") + '</div>' +
        '<div class="c">× ' + act.count + ' · 生命 ' + Math.max(0, act.hp) + '/' + act.maxHp + '</div>' +
        (traitNames(act).length ? '<div class="c">特性：' + traitNames(act).join(' · ') + '</div>' : '') +
        '</div></div>' +
        '<div class="stats">' +
        '<div>攻 <b>' + act.att + '</b></div><div>防 <b>' + act.def + '</b></div>' +
        '<div>伤 <b>' + act.dmg[0] + '–' + act.dmg[1] + '</b></div><div>速 <b>' + act.speed + '</b></div>' +
        (act.ranged ? '<div>弹 <b>' + (act.shots || 0) + '/' + act.maxShots + '</b></div>' +
          '<div>' + (canShootNow(act) ? '远程'
            : ((act.shots || 0) === 0 ? '弹药尽·近战' : (inMelee(act) ? '被贴身·近战' : '移动后·近战'))) +
          (canShootNow(act) || act.noMeleePenalty ? '' : '·减半') + '</div>' : '') +
        '</div>';
    } else {
      card.style.display = "none";
    }

    renderQueue();

    var myTurn = !!act && act.side === "us" && !over && !quickMode && !autoMode;
    var canChoose = myTurn && !hasMoved;      // 走过位就只能打或过去，防御/等待都作废
    document.getElementById("btnDefend").disabled = !canChoose;
    document.getElementById("btnWait").disabled = !canChoose;

    renderPreview();
    updateConfirmBar();
  }

  function renderQueue() {
    var box = document.getElementById("queue");
    box.innerHTML = "";
    if (!order) return;
    var shown = 0;
    order.forEach(function(id){
      if (shown >= 10) return;
      var u = units.filter(function(q){ return q.id === id; })[0];
      if (!u) return;
      var d = document.createElement("div");
      d.className = "qtok " + u.side + (u.dead ? " dead" : "") + (shown === 0 ? " now" : "");
      d.textContent = u.glyph;
      var s = document.createElement("span");
      s.textContent = u.dead ? "0" : (u.count >= 100 ? "99+" : u.count);
      d.appendChild(s);
      box.appendChild(d);
      shown++;
    });
  }

  document.getElementById("cfYes").addEventListener("click", function(){
    var act = current();
    if (!act || !pendingAttack) return;
    if (pendingAttack.actId !== act.id) { pendingAttack = null; updateConfirmBar(); return; }
    performAttack(act, pendingAttack.target, pendingAttack.spot);
  });

  document.getElementById("cfNo").addEventListener("click", function(){
    var act = current();
    var t = pendingAttack && pendingAttack.target;
    pendingAttack = null;
    // 取消后回到选位置状态，而不是把整个流程丢掉（贴身也一样能换站位）
    if (act && t && !t.dead && !hasMoved) {
      approachMode = { target: t };
      hoverUnit = t;
      render();
      setHint(approachHint(act, t));
      return;
    }
    hoverUnit = null;
    render();
    setHint("已取消 · 点击其他目标或蓝格继续");
  });

  document.getElementById("btnDefend").addEventListener("click", function(){
    var act = current();
    if (!act || act.side !== "us" || hasMoved) return;
    act.defending = true;
    log("<b>" + act.name + "</b> 原地防御（防御 +20%）", "us");
    render();
    endActorSoon(200);
  });

  document.getElementById("btnWait").addEventListener("click", function(){
    var act = current();
    if (!act || act.side !== "us" || hasMoved) return;
    if (order.length > 1) {
      order.push(order.shift());
      log("<b>" + act.name + "</b> 等待，本轮延后行动", "us");
      selected = null;
      nextActor();
    }
  });

  // 两个入口：手动（进棋盘自己打）/ 快速（双方 AI 代打、出战报）。
  // stepDelay / FX_ON 是"这一场怎么打"的设置，只在这里动，
  // init 不碰它（测试用 setStep 设同步走位，init 若重置会把设置冲掉）
  function startManual() { wantQuick = false; wantAuto = false; stepDelay = 70; FX_ON = true; init(); }
  function startQuick()  { wantQuick = true;  wantAuto = false; stepDelay = 0;  FX_ON = false; init(); }
  function startAuto()   { wantQuick = false; wantAuto = true;  stepDelay = 70; FX_ON = true; init();
    log("自动战斗：我方也由 AI 代打（原版 Auto Combat），随时点「接管」介入", "sys"); }

  /* 接管 = 原版 Auto Combat 的开关（A 键 toggle）：
     - AI 还在思考（决策未出手）→ 这一手直接归玩家；
     - AI 已开动（走位/出手动画中）→ 这一手打完，从下一手起归玩家（动画不硬掐）。 */
  function takeover() {
    if (over || !autoMode) return;
    autoMode = false;
    wantAuto = false;
    var act = current();
    log("手动接管" + (act && act.side === "us" ? "：" + act.name + " 这一手归你" : "：从下一个我方单位起"), "sys");
    if (act && act.side === "us" && !busy && !settling && !turnClaimed) {
      playerTurn(act);          // AI 还没开动 → 立即交还这一手
    } else {
      setHint("已接管 · " + (act ? act.name + " 正在行动，下一手起由你操作" : "下一手起由你操作"));
      render();
    }
    syncAutoBtn();
  }

  // 自动/接管 按钮：同一枚开关（原版就是 toggle），文案随状态变
  function syncAutoBtn() {
    var b = document.getElementById("btnAuto");
    b.textContent = autoMode ? "接管" : "自动战斗";
    b.disabled = !!over || !!quickMode;
  }

  document.getElementById("restart").addEventListener("click", startManual);
  document.getElementById("quick").addEventListener("click", function(){
    startQuick();
    log("快速战斗：双方由 AI 代打（原版 Quick Combat 语义）", "sys");
  });
  document.getElementById("btnAuto").addEventListener("click", function(){
    if (over) { startAuto(); return; }        // 战斗已结束 → 再来一场自动的
    if (autoMode) { takeover(); return; }     // 自动中 → 接管
    // 手动中 → 从现在起交给 AI（当前这一手也交出去）
    autoMode = true; wantAuto = true;
    log("自动战斗开启：我方交由 AI 代打，随时点「接管」介入", "sys");
    var act = current();
    // 不看 turnClaimed：玩家已认领的这一手要主动让给 AI，否则两边都不动会卡死
    if (act && act.side === "us" && !busy && !settling) {
      pendingAttack = null; approachMode = null; chosenApproach = null; hoverUnit = null;
      turnClaimed = true;
      aiAct(act);
    }
    syncAutoBtn();
  });

  function init() {
    clearFlowTimers();                  // 旧战斗的流程定时器一律作废
    var ov = document.querySelector(".over");
    if (ov) ov.remove();
    gUnit.innerHTML = "";
    gFx.innerHTML = "";
    quickMode = wantQuick;
    autoMode = wantAuto && !wantQuick;
    turnClaimed = false;
    busy = false;
    settling = false;
    units = makeUnits();
    faceAll();                          // 开局站位：双格单位的头一律朝敌人
    roundNo = 1;
    order = [];
    selected = null;
    hasMoved = false;
    moveMap = new Map();
    atkSet = new Set();
    over = null;
    hoverUnit = null;
    pendingAttack = null;
    approachMode = null; chosenApproach = null; lastHoverId = null;
    document.getElementById("roundNo").textContent = "1";
    document.getElementById("log").innerHTML = "";
    document.getElementById("btnDefend").disabled = quickMode || autoMode;
    document.getElementById("btnWait").disabled = quickMode || autoMode;
    log((quickMode ? "快速战斗" : autoMode ? "自动战斗" : "遭遇战") + "开始 · 我方 5 队 vs 敌方 4 队", "sys");
    syncAutoBtn();
    renderHeroBar();
    attachTestHooks();               // 测试契约补挂（浏览器里无 __T，直接跳过）
    render();
    startRound();
  }

  init();
})();
</script>
</body>
</html>
