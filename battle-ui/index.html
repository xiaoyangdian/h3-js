      setHint(u.name + " × " + u.count + " · " + opts.length +
        " 个落脚格可达 · 点它选择从哪一侧进攻");
    }
    renderPreview();
  }

  function render() {
    var act = current();

    for (var y = 0; y < H; y++) {
      for (var x2 = 0; x2 < W; x2++) {
        var e = hexEls[key(x2, y)];
        e.classList.remove("in-range", "atk", "sel", "can-move", "can-attack");
        if (selected && selected === act) {
          if (moveMap.has(key(x2, y)) && moveMap.get(key(x2, y)) > 0 && !unitAt(x2, y)) {
            e.classList.add("in-range", "can-move");
          }
          if (atkSet.has(key(x2, y))) {
            e.classList.add("atk", "can-attack");
          }
        }
      }
    }
    if (selected) {
      cellsOf(selected).forEach(function(c){
        var se = hexEls[key(c[0], c[1])];
        if (se) se.classList.add("sel");
      });
    }

    units.forEach(function(u){
      if (u.dead) return;
      ensureUnitEl(u);
      layoutUnit(u);
      var c = center(u.x, u.y);
      u.el.style.transform = "translate(" + c.cx + "px," + c.cy + "px)";
      u.el.classList.toggle("active", act === u);
      u.el.classList.toggle("defending", !!u.defending);
      u.el.classList.toggle("foe", !!(act && u.side !== act.side && atkSet.has(key(u.x, u.y))));
      u.cntEl.textContent = u.count;
      if (u.count >= 100) {
        u.cntEl.textContent = "99+";
      }
      var pct = Math.max(0, u.hp / u.maxHp);
      u.hpEl.setAttribute("width", (30 * pct).toFixed(2));
    });

    var card = document.getElementById("curCard");
    if (act && act.side === "us") {
      card.style.display = "";
      card.innerHTML =
        '<h3>当前行动</h3>' +
        '<div class="who"><div class="dot us">' + act.glyph + '</div>' +
        '<div><div class="n">' + act.name + (act.breath ? " · 龙息" : "") + (act.defending ? " · 防御中" : "") + '</div>' +
        '<div class="c">× ' + act.count + ' · 生命 ' + Math.max(0, act.hp) + '/' + act.maxHp + '</div></div></div>' +
        '<div class="stats">' +
        '<div>攻 <b>' + act.att + '</b></div><div>防 <b>' + act.def + '</b></div>' +
        '<div>伤 <b>' + act.dmg[0] + '–' + act.dmg[1] + '</b></div><div>速 <b>' + act.speed + '</b></div>' +
        (act.ranged ? '<div>弹 <b>' + (act.shots || 0) + '/' + act.maxShots + '</b></div>' +
          '<div>' + (canShootNow(act) ? '远程'
            : ((act.shots || 0) === 0 ? '弹药尽·近战' : (inMelee(act) ? '被贴身·近战' : '移动后·近战'))) +
          (canShootNow(act) || act.noMeleePenalty ? '' : '·减半') + '</div>' : '') +
        '</div>';
    } else {
      card.style.display = "none";
    }

    renderQueue();

    var myTurn = !!act && act.side === "us" && !over && !quickMode && !autoMode;
    var canChoose = myTurn && !hasMoved;      // 走过位就只能打或过去，防御/等待都作废
    document.getElementById("btnDefend").disabled = !canChoose;
    document.getElementById("btnWait").disabled = !canChoose;

    renderPreview();
    updateConfirmBar();
  }

  function renderQueue() {
    var box = document.getElementById("queue");
    box.innerHTML = "";
    if (!order) return;
    var shown = 0;
    order.forEach(function(id){
      if (shown >= 10) return;
      var u = units.filter(function(q){ return q.id === id; })[0];
      if (!u) return;
      var d = document.createElement("div");
      d.className = "qtok " + u.side + (u.dead ? " dead" : "") + (shown === 0 ? " now" : "");
      d.textContent = u.glyph;
      var s = document.createElement("span");
      s.textContent = u.dead ? "0" : (u.count >= 100 ? "99+" : u.count);
      d.appendChild(s);
      box.appendChild(d);
      shown++;
    });
  }

  document.getElementById("cfYes").addEventListener("click", function(){
    var act = current();
    if (!act || !pendingAttack) return;
    if (pendingAttack.actId !== act.id) { pendingAttack = null; updateConfirmBar(); return; }
    performAttack(act, pendingAttack.target, pendingAttack.spot);
  });

  document.getElementById("cfNo").addEventListener("click", function(){
    var act = current();
    var t = pendingAttack && pendingAttack.target;
    pendingAttack = null;
    // 取消后回到选位置状态，而不是把整个流程丢掉（贴身也一样能换站位）
    if (act && t && !t.dead && !hasMoved) {
      approachMode = { target: t };
      hoverUnit = t;
      render();
      setHint(approachHint(act, t));
      return;
    }
    hoverUnit = null;
    render();
    setHint("已取消 · 点击其他目标或蓝格继续");
  });

  document.getElementById("btnDefend").addEventListener("click", function(){
    var act = current();
    if (!act || act.side !== "us" || hasMoved) return;
    act.defending = true;
    log("<b>" + act.name + "</b> 原地防御（防御 +20%）", "us");
    render();
    endActorSoon(200);
  });

  document.getElementById("btnWait").addEventListener("click", function(){
    var act = current();
    if (!act || act.side !== "us" || hasMoved) return;
    if (order.length > 1) {
      order.push(order.shift());
      log("<b>" + act.name + "</b> 等待，本轮延后行动", "us");
      selected = null;
      nextActor();
    }
  });

  // 两个入口：手动（进棋盘自己打）/ 快速（双方 AI 代打、出战报）。
  // stepDelay / FX_ON 是"这一场怎么打"的设置，只在这里动，
  // init 不碰它（测试用 setStep 设同步走位，init 若重置会把设置冲掉）
  function startManual() { wantQuick = false; wantAuto = false; stepDelay = 70; FX_ON = true; init(); }
  function startQuick()  { wantQuick = true;  wantAuto = false; stepDelay = 0;  FX_ON = false; init(); }
  function startAuto()   { wantQuick = false; wantAuto = true;  stepDelay = 70; FX_ON = true; init();
    log("自动战斗：我方也由 AI 代打（原版 Auto Combat），随时点「接管」介入", "sys"); }

  /* 接管 = 原版 Auto Combat 的开关（A 键 toggle）：
     - AI 还在思考（决策未出手）→ 这一手直接归玩家；
     - AI 已开动（走位/出手动画中）→ 这一手打完，从下一手起归玩家（动画不硬掐）。 */
  function takeover() {
    if (over || !autoMode) return;
    autoMode = false;
    wantAuto = false;
    var act = current();
    log("手动接管" + (act && act.side === "us" ? "：" + act.name + " 这一手归你" : "：从下一个我方单位起"), "sys");
    if (act && act.side === "us" && !busy && !settling && !turnClaimed) {
      playerTurn(act);          // AI 还没开动 → 立即交还这一手
    } else {
      setHint("已接管 · " + (act ? act.name + " 正在行动，下一手起由你操作" : "下一手起由你操作"));
      render();
    }
    syncAutoBtn();
  }

  // 自动/接管 按钮：同一枚开关（原版就是 toggle），文案随状态变
  function syncAutoBtn() {
    var b = document.getElementById("btnAuto");
    b.textContent = autoMode ? "接管" : "自动战斗";
    b.disabled = !!over || !!quickMode;
  }

  document.getElementById("restart").addEventListener("click", startManual);
  document.getElementById("quick").addEventListener("click", function(){
    startQuick();
    log("快速战斗：双方由 AI 代打（原版 Quick Combat 语义）", "sys");
  });
  document.getElementById("btnAuto").addEventListener("click", function(){
    if (over) { startAuto(); return; }        // 战斗已结束 → 再来一场自动的
    if (autoMode) { takeover(); return; }     // 自动中 → 接管
    // 手动中 → 从现在起交给 AI（当前这一手也交出去）
    autoMode = true; wantAuto = true;
    log("自动战斗开启：我方交由 AI 代打，随时点「接管」介入", "sys");
    var act = current();
    // 不看 turnClaimed：玩家已认领的这一手要主动让给 AI，否则两边都不动会卡死
    if (act && act.side === "us" && !busy && !settling) {
      pendingAttack = null; approachMode = null; chosenApproach = null; hoverUnit = null;
      turnClaimed = true;
      aiAct(act);
    }
    syncAutoBtn();
  });

  function init() {
    clearFlowTimers();                  // 旧战斗的流程定时器一律作废
    var ov = document.querySelector(".over");
    if (ov) ov.remove();
    gUnit.innerHTML = "";
    gFx.innerHTML = "";
    quickMode = wantQuick;
    autoMode = wantAuto && !wantQuick;
    turnClaimed = false;
    busy = false;
    settling = false;
    units = makeUnits();
    faceAll();                          // 开局站位：双格单位的头一律朝敌人
    roundNo = 1;
    order = [];
    selected = null;
    hasMoved = false;
    moveMap = new Map();
    atkSet = new Set();
    over = null;
    hoverUnit = null;
    pendingAttack = null;
    approachMode = null; chosenApproach = null; lastHoverId = null;
    document.getElementById("roundNo").textContent = "1";
    document.getElementById("log").innerHTML = "";
    document.getElementById("btnDefend").disabled = quickMode || autoMode;
    document.getElementById("btnWait").disabled = quickMode || autoMode;
    log((quickMode ? "快速战斗" : autoMode ? "自动战斗" : "遭遇战") + "开始 · 我方 5 队 vs 敌方 4 队", "sys");
    syncAutoBtn();
    render();
    startRound();
  }

  init();
})();
</script>
</body>
</html>
